<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册页面</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="stylesheet" type="text/css" href="css/body.css" />
</head>
<body>
<div class="container">
    <section id="content">
        <form action="" method="post">
            <h1>会员注册</h1>
            <div>
                <input type="text" placeholder="用户名" required="" id="username" name="username"/>
            </div>
            <div>
                <input type="password" placeholder="密码" required="" id="password" name="password"/>
            </div>
            <div>
                <input type="password" placeholder="确认密码" required="" id="confirm_password" name="confirm_password"/>
            </div>
            <div>
                <span class="help-block u-errormessage" id="js-server-helpinfo">&nbsp;</span>
            </div>
            <div>
                <!-- <input type="submit" value="Log in" /> -->
                <input type="submit" value="注册"/>
                <a href="#">去登录</a>
                <!-- <a href="#">Register</a> -->
            </div>
        </form><!-- form -->
    </section><!-- content -->
</div>
<!-- container -->
</body>
</html>
