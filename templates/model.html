<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>default过滤器</title>

<body>
    {% autoescape off %}  <!-- False不转义；True转义-->

    {{ info | escape }}  <!-- escape确保转义 -->   
    {% endautoescape %}
</body>
</html>
